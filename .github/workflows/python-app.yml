# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install ansible-core
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 plugins/modules/python.py --count --max-line-length=160 --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 plugins/modules/python.py --count --exit-zero --max-complexity=10 --max-line-length=160 --statistics --ignore=E402
    - name: Build collection
      run: |
        ansible-galaxy collection build
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Get built artifact name
      id: get_tar
      run: |
        TAR_FILE=$(ls *.tar.gz | head -n 1)
        echo "tar_path=$TAR_FILE" >> $GITHUB_OUTPUT
    - name: Install collection
      run: |
        ansible-galaxy collection install ${{ steps.get_tar.outputs.tar_path }} --force
    - name: Test with ansible-test
      run: |
        ansible-test integration mriamh.uv.python
