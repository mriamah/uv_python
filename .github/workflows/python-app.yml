# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install ansible-core
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 plugins/modules/python.py --count --max-line-length=160 --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 plugins/modules/python.py --count --exit-zero --max-complexity=10 --max-line-length=160 --statistics --ignore=E402
    - name: Build collection
      run: |
        ansible-galaxy collection build --output-path dist/
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        path: dist/*.tar.gz
        retention-days: 1
    - name: debug
      run: ls -lR
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: debug
      run: ls -laR
    - name: Download all workflow run artifacts
      uses: actions/download-artifact@v4
      with:
        name: artifact
        path: dist/
    - name: debug
      run: ls -lR
    - name: Install collection
      run: |
        ansible-galaxy collection install dist/*.tar.gz --force
    - name: Prepare collection layout
      run: |
        mkdir -p ansible_collections/mriamah
        cp -r plugins/ ansible_collections/mriamah/uv
        cp -r tests/ ansible_collections/mriamah/uv
    - name: Run integration tests with ansible-test
      working-directory: ansible_collections/mriamah/uv
      run: |
        ansible-test integration -v python
    - name: Run sanity checks with ansible-test
      working-directory: ansible_collections/mriamah/uv
      run: |
        ansible-test sanity --docker -v
        ansible-test sanity --docker --test validate-modules
